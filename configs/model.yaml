# FedAirGuard — model hyperparameters (CLAUDE.md §7)

seed: 1337

# ---------------------------------------------------------------------------
# Node tier: per-station GRU encoder-decoder (§7.1)
# ---------------------------------------------------------------------------
node_gru:
  hidden_size: 64
  num_layers: 1
  dropout: 0.1
  # The encoder's final hidden state is what leaves the node for the server GNN.
  # Nothing else does. Keeping this small is both a privacy and a comms lever
  # (§8.2 "communication cost per round").
  embedding_size: 64

  train:
    # auto | cpu | cuda. "auto" uses the GPU when torch reports one and falls
    # back to CPU otherwise, so this file stays valid on a machine without a
    # dGPU and the test suite needs no special casing. Everything in this
    # project ran on CPU until 2026-10-13, not by choice but because the
    # installed wheel was torch+cpu on a machine with an idle RTX 4060.
    device: auto
    epochs: 40
    batch_size: 128
    lr: 0.001
    weight_decay: 0.0
    grad_clip: 1.0
    early_stopping_patience: 6
    scheduler: plateau
    scheduler_factor: 0.5
    scheduler_patience: 3

# ---------------------------------------------------------------------------
# Centralised baselines (§8.1 rungs 3 and 4)
# ---------------------------------------------------------------------------
centralised_gru:
  # Same architecture, one shared set of weights over the pooled window set.
  # NOTE: pooling here is of WINDOWS, not of normalization. Each station is
  # still z-scored on its own training window (§2.2 / §6.5) and every metric is
  # still reported per station. Only the model weights are shared.
  hidden_size: 64
  num_layers: 1
  dropout: 0.1
  train:
    epochs: 40
    batch_size: 256
    lr: 0.001
    grad_clip: 1.0
    early_stopping_patience: 6

# ---------------------------------------------------------------------------
# Server tier: graph network over uploaded hidden states (§7.2) — Phase 2
# ---------------------------------------------------------------------------
server_gnn:
  hidden_size: 64
  num_layers: 2
  heads: 4
  dropout: 0.1
  # Edge construction. Wang et al. (2020) justifies physically-informed edges.
  graph:
    mode: hybrid              # distance | correlation | hybrid
    distance_km_threshold: 12.0
    correlation_threshold: 0.5
    # Correlation is computed on the SERVER from uploaded embeddings, never
    # from raw station series (§2.4).
    self_loops: true

# ---------------------------------------------------------------------------
# Decision layer (§7.4) — Phase 2
# ---------------------------------------------------------------------------
decision_layer:
  # Residual threshold is calibrated per station on the VALIDATION split only.
  residual_threshold:
    # quantile | mad | val_f1_sweep | val_fpr_extremes
    # A fixed quantile silently assumes the fault rate equals 1 - quantile.
    # val_f1_sweep picks the operating point from the data instead.
    # MEASURED 2026-10-06 (CONTEXT.md entry 6). val_fpr_extremes gives the best
    # F1 at 3h and 6h *and* by far the lowest false-positive rate on genuine
    # episodes: at 6h it cuts fpr_on_extremes from 0.520 to 0.164 (worst station
    # 0.691 -> 0.306) against the 0.98 quantile. `mad` is the worst option by a
    # wide margin — 0.850 at 6h — and should not be used.
    method: val_fpr_extremes
    quantile: 0.98            # fallback, and used by method: quantile
    # Used by val_fpr_extremes: cap on how often a genuine high-pollution
    # reading may be called a fault. Measured at up to 0.667 with the naive
    # detector (CONTEXT.md entry 5), which is what this exists to control.
    target_fpr_extremes: 0.10

  # How the anomaly score is formed from the forecast residual.
  #   absolute   |y - yhat| / station scale        (the naive detector)
  #   volatility |y - yhat| / recent local volatility
  # Real pollution episodes are preceded by turbulent hours, so dividing by the
  # volatility of the window's own 24h input suppresses the false positives
  # that a plain residual produces on genuine events.
  # MEASURED 2026-10-06: volatility scaling did NOT work and the default is
  # back to `absolute`. It does lower fpr_on_extremes at a matched threshold
  # rule, but it degrades the threshold-free ranking at every horizon — AUC-PR
  # 0.204/0.256/0.264 against 0.274/0.302/0.297 for absolute at 1h/3h/6h. The
  # false-positive problem is better handled by the threshold method above,
  # which costs no ranking quality. Kept selectable so the result stays
  # reproducible rather than merely asserted. CONTEXT.md entry 6.
  score:
    mode: absolute            # absolute | volatility
    # Floor on the volatility divisor, as a fraction of the station's own
    # training scale, so a very calm window cannot explode a small residual.
    volatility_floor: 0.25
  spatial_agreement:
    metric: cosine            # cosine | learned
    high_agreement_threshold: 0.6
    min_neighbours: 2

  # Per-detector false-positive budget for the rung 6 ensemble, shared across
  # however many detectors are active (§7.4). MEASURED by sweep, CONTEXT.md
  # entry 11: F1 falls monotonically as the budget loosens — 0.396 at 0.005,
  # 0.296 at 0.02, 0.091 at 0.40 — so the tightest setting wins on aggregate.
  #
  # `on: overall` budgets false positives across ALL trustworthy readings.
  # Budgeting on extremes instead leaves the other ~95% of readings
  # unconstrained and drove precision to 0.027.
  #
  # Loosening this is a deliberate choice, not a bug: drift recall climbs from
  # 0.000 at 0.005 to 0.257 at 0.40, at a precision of 0.049. See entry 11 on
  # why a drift review queue may want that operating point even though an
  # alerting system never would.
  detector_budget:
    on: overall               # overall | extremes
    target_fpr_overall: 0.005

  # Two operating points, because one threshold cannot serve both jobs.
  # Spike/noise/dropout are incidents — a false alarm is expensive, so the
  # alert tier is tight. Drift/bias/stuck-at are calibration problems — a false
  # alarm costs one cheap inspection while a miss costs months of quietly wrong
  # data, so the review tier is deliberately loose. Collapsing both into one F1
  # is what made rung 6 look worse than it is (CONTEXT.md entries 10-11).
  operating_points:
    alert:
      target_fpr_overall: 0.005
    review:
      target_fpr_overall: 0.20
  # LOCKED (§7.4): never one global threshold silently inherited across regions.
  per_region_calibration: true
