# FedAirGuard — dataset configuration (CLAUDE.md §3, §6)
#
# Every path is relative to the repository root.

paths:
  raw: data/raw
  harmonized: data/harmonized
  processed: data/processed
  outputs: outputs

# ---------------------------------------------------------------------------
# Primary source: EEA Air Quality e-Reporting, Catalonia (CLAUDE.md §3.1)
# ---------------------------------------------------------------------------
eea:
  country: ES
  region: catalonia

  # LOCKED (CLAUDE.md §3.1): E1a = verified, annual, QA-reviewed.
  # E2a (Up-To-Date) carries provisional flags and must never be used.
  dataset: E1a

  # VERIFIED 2026-09-16 against the actual download. Two corrections to the
  # original guess, both measured rather than assumed:
  #
  # year_from: 2017, not 2013. EEA's Catalonia E1a delivery carries NO negative
  #   Validity codes before 2017 — 477,114 rows, every single one flagged valid,
  #   then ~2.6-3.5% faults every year from 2017 on. That is a change in
  #   reporting practice, not four fault-free years. Including those years
  #   dilutes the measured fault rate (1.91% over 2013-2025 vs 2.81% over
  #   2017-2024) and would train the model that older data never fails.
  #
  # year_to: 2024, and this one happens to be right but for the wrong reason.
  #   The service actually serves verified data into 2025 (airbase's own docs
  #   claiming 2013-2023 are stale), but only 2 of the 7 stations have 2025
  #   coverage — the other 5 have a single row. 2024 is the last year complete
  #   across the whole node set.
  #
  # All rows in the download are Verification=1. Validity codes present are
  # only 1 and -1: there is no -99 (maintenance) anywhere in this node set, so
  # the "most valuable label" in CLAUDE.md §3.1 is simply absent here.
  year_from: 2017
  year_to: 2024

  pollutants: [PM2.5, PM10, O3, NO2, SO2]

  # EEA's "city" is the greater urban area, not the municipality: filtering on
  # Barcelona returns 23 Catalonia stations, including some in neighbouring
  # municipalities. It cuts the download from ~2.2 GB (all of ES) to ~58 MB.
  # "Badalona" is not a city EEA recognises and is silently skipped.
  cities: [Barcelona]

  # Pollutant vocabulary codes and units (CLAUDE.md §3.1). CO is mg/m3 — the
  # unit trap. src/data/harmonize.py enforces this table.
  pollutant_units:
    SO2: ug/m3
    PM10: ug/m3
    PM2.5: ug/m3
    O3: ug/m3
    NO2: ug/m3
    CO: mg/m3

# ---------------------------------------------------------------------------
# Node set: 10 Barcelona city stations (CLAUDE.md §3.1)
# ---------------------------------------------------------------------------
# How the node set is chosen.
#   explicit — the hand-written `stations:` list below. Right for a small,
#              deliberately curated set.
#   registry — selected from the EEA registry by province and pollutant. Right
#              for the §3.1 scale-up, where hand-listing stops being sensible.
#              Catalonia is provinces 08/17/25/43; 71 stations report NO2.
#
# Entry 16 measured why this matters: with 7 stations, resampling stations
# widens every subtype interval past zero, so nothing generalises. More nodes
# is the only fix.
station_selection:
  mode: registry            # explicit | registry
  registry:
    provinces: ["08", "17", "25", "43"]
    require_pollutant: NO2
    max_stations: null

# VERIFIED 2026-09-16 against data/raw/eea_station_metadata.csv. All ten EoI
# codes exist in the EEA registry; every station_class below is now the
# registry's own area x type, not a guess. Several of the original guesses were
# wrong (ES1396A, ES1856A and ES1992A are background, not traffic/suburban;
# ES1480A and ES0559A are traffic, not background/industrial).
#
# The `name` fields are NOT verified — this registry export carries no station
# name column, so they remain best-effort labels. `municipality` comes from the
# INE prefix of AirQualityStationNatCode and IS verified.
#
# Re-check at any time with:
#     python -m src.data.station_metadata --refresh --print
#
# `no2` marks whether the station reports the current target pollutant. Only 7
# of the 10 do; the other 3 report PM10 (and PM2.5) only and will be excluded
# by the pipeline's target check while target_pollutant is NO2.
stations:
  - eoi_code: ES1438A
    name: Barcelona (Gracia - Sant Gervasi)
    station_class: urban_traffic
    municipality: Barcelona
    no2: true
  - eoi_code: ES1396A
    name: Barcelona (Eixample)
    station_class: urban_background
    municipality: Barcelona
    no2: true
  - eoi_code: ES1856A
    name: Barcelona (Sants)
    station_class: urban_background
    municipality: Barcelona
    no2: true
  - eoi_code: ES1679A
    name: Barcelona (Vall d'Hebron)
    station_class: urban_background
    municipality: Barcelona
    no2: true
  - eoi_code: ES0691A
    name: Barcelona (Ciutadella)
    station_class: urban_background
    municipality: Barcelona
    no2: true
  - eoi_code: ES1480A
    name: Barcelona (Poblenou)
    station_class: urban_traffic
    municipality: Barcelona
    no2: true
  - eoi_code: ES1992A
    name: Barcelona (Observatori Fabra)
    station_class: urban_background
    municipality: Barcelona
    no2: true
  # --- the three below report no NO2, and are outside EEA's "Barcelona" city
  # --- filter, so they are absent from the current download.
  - eoi_code: ES2027A
    name: Badalona
    station_class: urban_background
    municipality: Badalona
    no2: false
  - eoi_code: ES1362A
    name: Sant Adria de Besos
    station_class: urban_background
    municipality: Sant Adria de Besos
    no2: false
    note: sampling point closed 2017-12-31
  - eoi_code: ES0559A
    name: Barcelona (Sants - traffic)
    station_class: urban_traffic
    municipality: Barcelona
    no2: false

# ---------------------------------------------------------------------------
# Preprocessing (CLAUDE.md §6)
# ---------------------------------------------------------------------------
preprocessing:
  # Forecasting target. Multivariate in, univariate out.
  target_pollutant: NO2
  # Extra pollutants used as exogenous inputs where the station reports them.
  feature_pollutants: [PM10, PM2.5, O3, SO2]

  imputation:
    short_gap_hours: 3          # <= 3h -> linear interpolation (§6.2)
    seasonal_period_hours: 24   # longer -> same hour, previous day
    max_fill_hours: 168         # beyond a week, leave NaN and drop the window

  physical_screen:              # §6.3
    flatline_run_length: 6      # > 6 identical consecutive values
    ranges:                     # ug/m3 unless noted; generous outer bounds
      PM2.5: [0.0, 1000.0]
      PM10: [0.0, 2000.0]
      NO2: [0.0, 1000.0]
      O3: [0.0, 800.0]
      SO2: [0.0, 1000.0]
      CO: [0.0, 100.0]          # mg/m3
      temperature_c: [-30.0, 55.0]
      pressure_hpa: [870.0, 1085.0]
      relative_humidity: [0.0, 100.0]
      wind_speed_ms: [0.0, 75.0]

  features:                     # §6.4
    cyclical: [hour, dayofweek, month]
    lags: [1, 24, 168]
    rolling_windows: [6, 24]

  windowing:                    # §6.6
    input_hours: 24
    horizon_hours: 6
    stride: 1
    horizons_reported: [1, 3, 6]
    split: {train: 0.70, val: 0.15, test: 0.15}

  quality:
    # Minimum fraction of the target series that must be genuinely observed
    # (not imputed) for a station to enter the node set at all.
    min_observed_fraction: 0.60
    # Minimum coverage an *exogenous* pollutant needs inside the training window
    # to survive as a feature. Below this it is dropped for that station only.
    # Every window requires all of its feature columns to be finite, so one
    # late-installed instrument would otherwise wipe out a station's whole
    # history (ES1438A gained PM10/PM2.5 in 2024 and lost 48,892 training
    # windows to them before this gate existed).
    min_feature_coverage: 0.80
    # §3.1: consider excluding Verification=3 rows from EVALUATION (not training).
    exclude_unverified_from_eval: true

# ---------------------------------------------------------------------------
# Meteorology — see CONTEXT.md "Open items"
# ---------------------------------------------------------------------------
# EEA Air Quality e-Reporting contains NO meteorological variables, but
# objective 3 requires them. Met data is therefore joined from an external
# reanalysis (Open-Meteo ERA5 archive, free, no API key). This is opt-in and
# clearly a deviation-by-necessity, not a silent design change.
meteo:
  # Enabled 2026-10-12. Closes the met half of objective 3. EEA carries no
  # meteorology, so this is Open-Meteo's ERA5 reanalysis sampled at each
  # station's registry coordinates — an external dependency and a flagged
  # deviation, documented in src/data/fetch_meteo.py and CONTEXT.md entry 1.
  enabled: true
  provider: open_meteo_era5
  variables:
    - temperature_2m
    - relative_humidity_2m
    - surface_pressure
    - wind_speed_10m
    - wind_direction_10m
    - precipitation
    # boundary_layer_height is DROPPED, reluctantly. It is the most physically
    # relevant variable here — it sets how much air the pollution mixes into —
    # but Open-Meteo's ERA5 archive has no values for 2024-01-01..2024-06-30,
    # 4,368 consecutive hours, which lands squarely in the test window. Since a
    # window needs every feature finite, keeping it cost ~45% of the test set,
    # and entry 16 showed the study is already underpowered. Re-enable if the
    # upstream gap is ever filled.
    # - boundary_layer_height

# ---------------------------------------------------------------------------
# Secondary source: CPCB / India (CLAUDE.md §3.2) — Phase 3 ONLY.
# ---------------------------------------------------------------------------
cpcb:
  enabled: false
  region: india
  # LOCKED (CLAUDE.md §2.6): no Validity equivalent exists. Every fault label on
  # CPCB-origin data is synthetic and is tagged label_source="synthetic".
  label_source: synthetic
