# FedAirGuard — federated training configuration (CLAUDE.md §5.7, §7.3)
# Phase 2. Present now so the contract is fixed before the code lands.

rounds: 60                    # maximum; early stopping usually ends it sooner
local_epochs: 2
client_fraction: 1.0          # all participating nodes join every round
seed: 1337

# Early stopping on mean validation loss across clients. The round that
# achieved the best value is what §8.2 calls "rounds to convergence"; without
# this, a fixed 60 rounds spends most of its compute after improvement stops.
early_stopping_patience: 8

train:
  # Larger batches than the local GRU (§ model.yaml node_gru) because a round
  # retrains every client, so per-round wall time dominates the run.
  batch_size: 256
  lr: 0.001
  grad_clip: 1.0

# ---------------------------------------------------------------------------
# Aggregation weighting (CLAUDE.md §5.7) — LOCKED DEFAULT
# ---------------------------------------------------------------------------
# Plain FedAvg weights each client by its local sample count. With a second
# region (CPCB) in play that lets whichever region has more stations or more
# readings dominate the global model. Region-first weighting is the default:
# every region gets equal aggregate weight regardless of station count, split
# evenly among that region's own stations.
aggregation:
  scheme: clustered          # region_first | sample_count | uniform | clustered
  # clustered = Hammad et al. (2026) Communities of Interest. The §5.7 stretch
  # version, now implemented: with a single region, region_first degenerates to
  # uniform, so at 69 Catalan stations a dense cluster of city-centre traffic
  # sites outvotes a lone rural one simply by being numerous. Communities are
  # nested INSIDE regions, so turning this on cannot undo the region guarantee
  # above.
  clustered:
    # null = sqrt(stations in region), rounded: 8 communities at 69 stations,
    # 3 at 7. A fixed number applies to every region regardless of its size.
    n_clusters: null
    # How much geography counts against learned behaviour when both are
    # available. 1.0 = proximity only, 0.0 = embedding similarity only.
    spatial_weight: 0.5
    # What it is permitted to cluster ON. Both are already server-side:
    # coordinates are public EEA registry metadata, and hidden states are
    # uploaded anyway under §7.1/§7.2 for the graph network. Raw series
    # correlation — Hammad's own input — would violate §2.4 and is not an
    # option here. See src/federated/aggregation_weights.cluster_assignments.
    features: [spatial_proximity, encoder_hidden_state, region]

# ---------------------------------------------------------------------------
# Privacy contract (CLAUDE.md §2.4, §7.1) — enforced in code, not by convention
# ---------------------------------------------------------------------------
# src/federated/client.py asserts every outbound payload against this list.
# Anything not named here is a contract violation and raises.
privacy:
  transmitted_from_node:
    - gru_weight_update
    - encoder_hidden_state
    - n_samples            # scalar count, needed for reporting only, never for
                           # aggregation weighting under region_first
    # AMENDED 2026-10-13 by the project owner, after being asked explicitly.
    # See CLAUDE.md §2.4a for the decision and its reasoning.
    #
    # A 5-level ORDINAL bucket of the station's own level deviation, measured
    # on ALREADY-NORMALISED data. Entry 15 established that a node's forecast
    # residual cannot see drift at all -- a slowly drifting sensor stays easy
    # to predict -- so no amount of server-side cleverness over residuals will
    # ever reach it. This is the smallest signal that can.
    #
    # Why it is defensible: the bucket is computed after §6.5 z-scoring, so it
    # says "this station currently sits about one of its own standard
    # deviations above its own training mean" and nothing whatsoever about what
    # that means in ug/m3. The scaler stays local; absolute scale is not
    # recoverable from an ordinal in 0..4.
    - level_bucket
  never_transmitted:
    - raw_readings
    - normalization_statistics
    - validity_flags
    - station_coordinates  # server holds these from public metadata, not uploads

communication:
  # Reported in §8.2 "communication cost per round (MB)".
  measure_payload_bytes: true
  compress_weights: false    # keep the honest, uncompressed number as baseline
split_learning:
  enabled: true
  # Epochs of server-GNN refresh per federated round. Warm-started, so a few
  # suffice; the model persists across rounds.
  gnn_epochs_per_round: 3
